; ESP32 → Wi-Fi → MQTT (JSON) for smart-home-dashboard
; Docs: ../docs/SETUP.md (unified telemetry payload)
;
; 1. Install PlatformIO (VS Code extension or CLI).
; 2. First build copies include/secrets.example.h → include/secrets.h — edit WiFi/MQTT there.
; 3. pio run -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
  adafruit/Adafruit AHTX0
  adafruit/Adafruit BusIO
extra_scripts = pre:scripts/prep_secrets.py
