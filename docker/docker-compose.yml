services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthome}
      POSTGRES_DB: ${POSTGRES_DB:-smarthome}
    # Host port defaults to 5433 so it does not clash with a local Postgres on 5432.
    # Override in .env: POSTGRES_PORT=5432
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthome} -d ${POSTGRES_DB:-smarthome}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwords:/mosquitto/config/passwords:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthome}:${POSTGRES_PASSWORD:-smarthome}@postgres:5432/${POSTGRES_DB:-smarthome}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-smarthome}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-smarthome}
      MQTT_TELEMETRY_TOPIC: smarthome/telemetry
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Backend rejects this placeholder at boot; set JWT_SECRET in docker/.env.
      JWT_SECRET: ${JWT_SECRET:-__REPLACE_ME__}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Browser on host talks to API at host:8000 (published below). Baked into client JS.
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        NEXT_PUBLIC_WS_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_WS_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - backend

  simulator:
    build:
      context: ../simulator
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-smarthome}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-smarthome}
      MQTT_TOPIC: smarthome/telemetry
      # 2s per cycle (bedroom, kitchen, living_room are staggered inside it)
      # gives the dashboard a calmer cadence; tighten to "1" for stress runs.
      INTERVAL_SEC: "2"
      # Probability of a per-room synthetic spike per tick. Spikes are
      # additionally rate-limited inside the simulator (~2-minute cooldown
      # per room) so the anomaly feed isn't dominated by repeated bursts.
      SPIKE_PROBABILITY: "0.003"
      JSON_DATASET_PATH: data/sensors_dataset.json
    depends_on:
      - mqtt

volumes:
  postgres_data:
  mqtt_data:
  mqtt_log:
